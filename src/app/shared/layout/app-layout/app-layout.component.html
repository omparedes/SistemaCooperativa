<div class="min-h-screen xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
      @if (mostrarAvisoVersion()) {
        <div class="mb-4 flex items-center justify-between gap-3 rounded-xl border border-brand-200 bg-brand-50/90 px-4 py-2.5 text-xs text-brand-900 shadow-xs dark:border-brand-900/50 dark:bg-brand-950/40 dark:text-brand-200">
          <div class="flex items-center gap-2">
            <span class="inline-flex h-2 w-2 rounded-full bg-brand-500 animate-ping"></span>
            <span>
              <strong>¡Nueva versión v{{ versionActual }} activa!</strong>
              Novedades en arqueo de caja, beneficios, saldo a favor y más.
            </span>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <a routerLink="/documentacion/novedades" (click)="descartarAvisoVersion()" class="font-semibold underline underline-offset-2 hover:text-brand-700 dark:hover:text-white transition">
              Ver novedades →
            </a>
            <button type="button" (click)="descartarAvisoVersion()" class="text-brand-400 hover:text-brand-600 dark:hover:text-brand-200 transition font-bold" title="Cerrar aviso">
              ✕
            </button>
          </div>
        </div>
      }
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
